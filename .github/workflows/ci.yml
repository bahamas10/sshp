name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Check style
        run: make check

  freebsd:
    name: Test (FreeBSD 15.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          copyback: false
          prepare: |
            pkg install -y bash gmake
          run: |
            gmake
            gmake check
            gmake test

  illumos:
    name: Test (illumos, OmniOS r151058)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build and test in OmniOS
        uses: vmactions/omnios-vm@v1
        with:
          # Comes with build-essential, for the linker and C compiler.
          release: r151058-build
          copyback: false
          run: |
            gmake
            gmake check
            gmake test
